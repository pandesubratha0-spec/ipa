<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem Nilai & Presensi IPA SMP - Kurikulum Merdeka</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel untuk JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @media print {
      header, .no-print, button, input[type="text"] {
        display: none !important;
      }
      body, main {
        background-color: #ffffff !important;
        color: #000000 !important;
      }
      .bg-slate-800, .bg-slate-900, .bg-slate-800\/80, .bg-slate-800\/90 {
        background-color: transparent !important;
        color: #000 !important;
        border-color: #ccc !important;
        box-shadow: none !important;
      }
      input {
        border: none !important;
        background: transparent !important;
        color: #000 !important;
      }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- ICON SVGs ---
    const Icon = ({ name, className = "w-4 h-4" }) => {
      const icons = {
        GraduationCap: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path strokeLinecap="round" strokeLinejoin="round" d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        ),
        BookMarked: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
            <path strokeLinecap="round" strokeLinejoin="round" d="M10 2v8l3-2 3 2V2"/>
          </svg>
        ),
        BookOpen: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path strokeLinecap="round" strokeLinejoin="round" d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        ),
        Users: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path strokeLinecap="round" strokeLinejoin="round" d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        ),
        Plus: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 5v14m-7-7h14"/>
          </svg>
        ),
        Search: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/>
            <path strokeLinecap="round" strokeLinejoin="round" d="m21 21-4.35-4.35"/>
          </svg>
        ),
        Award: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="6"/>
            <path strokeLinecap="round" strokeLinejoin="round" d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.74.524L12 19.571l-4.252 2.37a.5.5 0 0 1-.74-.525l1.515-8.525"/>
          </svg>
        ),
        TrendingUp: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
            <polyline points="16 7 22 7 22 13"/>
          </svg>
        ),
        CheckCircle: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
        ),
        Download: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        ),
        Printer: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <polyline points="6 9 6 2 18 2 18 9"/>
            <path strokeLinecap="round" strokeLinejoin="round" d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <rect x="6" y="14" width="12" height="8"/>
          </svg>
        ),
        Edit3: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 20h9"/>
            <path strokeLinecap="round" strokeLinejoin="round" d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        ),
        Trash2: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <polyline points="3 6 5 6 21 6"/>
            <path strokeLinecap="round" strokeLinejoin="round" d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            <line x1="10" y1="11" x2="10" y2="17"/>
            <line x1="14" y1="11" x2="14" y2="17"/>
          </svg>
        ),
        X: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        ),
        Save: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
        )
      };
      return icons[name] || null;
    };

    // --- DATA AWAL (DEFAULT DATABASE TP IPA) ---
    const initialDatabaseTP = [
      // Kelas 7
      { id: 'TP7-1', kelas: '7', kode: 'TP 7.1', elemen: 'Pemahaman IPA', deskripsi: 'Menerapkan konsep pengukuran, besaran, dan satuan dalam kehidupan sehari-hari serta keselamatan kerja di laboratorium.' },
      { id: 'TP7-2', kelas: '7', kode: 'TP 7.2', elemen: 'Pemahaman IPA', deskripsi: 'Menganalisis sifat materi, perubahan fisika dan kimia, serta metode pemisahan campuran secara sederhana.' },
      { id: 'TP7-3', kelas: '7', kode: 'TP 7.3', elemen: 'Pemahaman IPA', deskripsi: 'Memahami konsep suhu, kalor, pemuaian, dan perpindahan kalor beserta penerapannya.' },
      { id: 'TP7-4', kelas: '7', kode: 'TP 7.4', elemen: 'Keterampilan Proses', deskripsi: 'Mengidentifikasi tingkatan organisasi kehidupan serta keanekaragaman hayati dan interaksi dalam ekosistem.' },
      
      // Kelas 8
      { id: 'TP8-1', kelas: '8', kode: 'TP 8.1', elemen: 'Pemahaman IPA', deskripsi: 'Menganalisis struktur dan fungsi sel sebagai unit terkecil kehidupan serta keterkaitannya dengan sistem organ tubuh manusia.' },
      { id: 'TP8-2', kelas: '8', kode: 'TP 8.2', elemen: 'Pemahaman IPA', deskripsi: 'Menganalisis sistem pencernaan, pernapasan, peredaran darah, dan ekskresi manusia serta pencegahan gangguannya.' },
      { id: 'TP8-3', kelas: '8', kode: 'TP 8.3', elemen: 'Pemahaman IPA', deskripsi: 'Menerapkan konsep gaya, hukum Newton, dan usaha pada gerak benda serta pesawat sederhana.' },
      { id: 'TP8-4', kelas: '8', kode: 'TP 8.4', elemen: 'Keterampilan Proses', deskripsi: 'Menganalisis sifat-sifat cahaya, pembentukan bayangan pada cermin/lensa, dan prinsip kerja alat optik.' },

      // Kelas 9
      { id: 'TP9-1', kelas: '9', kode: 'TP 9.1', elemen: 'Pemahaman IPA', deskripsi: 'Menganalisis sistem reproduksi manusia, kelainan, serta penerapan pola hidup yang menunjang kesehatan reproduksi.' },
      { id: 'TP9-2', kelas: '9', kode: 'TP 9.2', elemen: 'Pemahaman IPA', deskripsi: 'Memahami konsep pewarisan sifat (genetika) dan penerapannya dalam pemuliaan makhluk hidup.' },
      { id: 'TP9-3', kelas: '9', kode: 'TP 9.3', elemen: 'Pemahaman IPA', deskripsi: 'Menerapkan konsep listrik statis, listrik dinamis, kemagnetan, dan induksi elektromagnetik.' },
      { id: 'TP9-4', kelas: '9', kode: 'TP 9.4', elemen: 'Keterampilan Proses', deskripsi: 'Menganalisis prinsip bioteknologi konvensional dan modern serta dampaknya bagi kehidupan manusia.' }
    ];

    // --- SAMPLE DATA SISWA INITIAL ---
    const generateInitialSiswa = (kelas) => {
      const sampleNames = {
        '7': ['Aditya Pratama', 'Aulia Rahma', 'Bagas Satria', 'Citra Dewi', 'Daffa Al-Fariqi', 'Eka Putri'],
        '8': ['Fajar Ramadhan', 'Gita Gutawa', 'Hadi Wijaya', 'Indah Permata', 'Joko Susilo', 'Khadijah Nur'],
        '9': ['Luthfi Afandi', 'Mawar Eva', 'Naufal Rizky', 'Olivia Zalianty', 'Putra Utama', 'Qonita Aulia']
      };

      return sampleNames[kelas].map((name, index) => ({
        id: `SISWA-${kelas}-${index + 1}`,
        nisn: `00${kelas}82910${index + 1}`,
        nama: name,
        gender: index % 2 === 0 ? 'L' : 'P',
        presensi: { H: 16, S: 1, I: 1, A: 0 },
        nilaiTP: {
          1: 75 + Math.floor(Math.random() * 20),
          2: 70 + Math.floor(Math.random() * 25),
          3: 80 + Math.floor(Math.random() * 15),
          4: 72 + Math.floor(Math.random() * 22)
        },
        sumatifMateri: 78 + Math.floor(Math.random() * 18),
        pas: 75 + Math.floor(Math.random() * 20)
      }));
    };

    function App() {
      const [activeTab, setActiveTab] = useState('tp-db');
      
      // Ambil data dari LocalStorage jika ada
      const [databaseTP, setDatabaseTP] = useState(() => {
        const saved = localStorage.getItem('ipa_tp_db');
        return saved ? JSON.parse(saved) : initialDatabaseTP;
      });

      const [siswaData, setSiswaData] = useState(() => {
        const saved = localStorage.getItem('ipa_siswa_data');
        return saved ? JSON.parse(saved) : {
          '7': generateInitialSiswa('7'),
          '8': generateInitialSiswa('8'),
          '9': generateInitialSiswa('9')
        };
      });

      // Simpan otomatis ke LocalStorage
      useEffect(() => {
        localStorage.setItem('ipa_tp_db', JSON.stringify(databaseTP));
      }, [databaseTP]);

      useEffect(() => {
        localStorage.setItem('ipa_siswa_data', JSON.stringify(siswaData));
      }, [siswaData]);

      // State Modal Tambah/Edit Siswa
      const [isSiswaModalOpen, setIsSiswaModalOpen] = useState(false);
      const [editingSiswa, setEditingSiswa] = useState(null);
      const [siswaForm, setSiswaForm] = useState({ nisn: '', nama: '', gender: 'L' });

      // State Modal Tambah/Edit TP
      const [isTPModalOpen, setIsTPModalOpen] = useState(false);
      const [editingTP, setEditingTP] = useState(null);
      const [tpForm, setTpForm] = useState({ kelas: '7', kode: '', elemen: 'Pemahaman IPA', deskripsi: '' });

      // State pencarian
      const [searchTerm, setSearchTerm] = useState('');

      // ---------------- KONTROL SISWA ----------------
      const handleAddOrUpdateSiswa = (kelas) => {
        if (!siswaForm.nama || !siswaForm.nisn) {
          alert('Mohon isi NISN dan Nama Siswa.');
          return;
        }

        if (editingSiswa) {
          setSiswaData(prev => ({
            ...prev,
            [kelas]: prev[kelas].map(s => s.id === editingSiswa.id ? { ...s, ...siswaForm } : s)
          }));
        } else {
          const newSiswa = {
            id: `SISWA-${kelas}-${Date.now()}`,
            nisn: siswaForm.nisn,
            nama: siswaForm.nama,
            gender: siswaForm.gender,
            presensi: { H: 18, S: 0, I: 0, A: 0 },
            nilaiTP: { 1: 80, 2: 80, 3: 80, 4: 80 },
            sumatifMateri: 80,
            pas: 80
          };
          setSiswaData(prev => ({
            ...prev,
            [kelas]: [...prev[kelas], newSiswa]
          }));
        }
        setIsSiswaModalOpen(false);
        setEditingSiswa(null);
        setSiswaForm({ nisn: '', nama: '', gender: 'L' });
      };

      const handleDeleteSiswa = (kelas, id) => {
        if (window.confirm('Apakah Anda yakin ingin menghapus siswa ini?')) {
          setSiswaData(prev => ({
            ...prev,
            [kelas]: prev[kelas].filter(s => s.id !== id)
          }));
        }
      };

      const handleUpdateNilaiOrPresensi = (kelas, siswaId, category, field, value) => {
        const numValue = Math.max(0, parseInt(value, 10) || 0);

        setSiswaData(prev => ({
          ...prev,
          [kelas]: prev[kelas].map(s => {
            if (s.id !== siswaId) return s;

            if (category === 'presensi') {
              return { ...s, presensi: { ...s.presensi, [field]: numValue } };
            } else if (category === 'nilaiTP') {
              return { ...s, nilaiTP: { ...s.nilaiTP, [field]: Math.min(100, numValue) } };
            } else {
              return { ...s, [field]: Math.min(100, numValue) };
            }
          })
        }));
      };

      // ---------------- KONTROL TP ----------------
      const handleAddOrUpdateTP = () => {
        if (!tpForm.kode || !tpForm.deskripsi) {
          alert('Mohon isi kode dan deskripsi TP.');
          return;
        }

        if (editingTP) {
          setDatabaseTP(prev => prev.map(item => item.id === editingTP.id ? { ...item, ...tpForm } : item));
        } else {
          const newTP = {
            id: `TP-${Date.now()}`,
            ...tpForm
          };
          setDatabaseTP(prev => [...prev, newTP]);
        }
        setIsTPModalOpen(false);
        setEditingTP(null);
        setTpForm({ kelas: '7', kode: '', elemen: 'Pemahaman IPA', deskripsi: '' });
      };

      const handleDeleteTP = (id) => {
        if (window.confirm('Hapus Tujuan Pembelajaran ini dari database?')) {
          setDatabaseTP(prev => prev.filter(t => t.id !== id));
        }
      };

      // ---------------- KALKULASI REKAP & KETUNTASAN ----------------
      const calculateSiswaStats = (siswa, kelas) => {
        const tpValues = Object.values(siswa.nilaiTP || {});
        const avgTP = tpValues.length ? (tpValues.reduce((a, b) => a + b, 0) / tpValues.length) : 0;
        
        // Bobot: 40% Rata-rata TP + 30% Sumatif Materi + 30% PAS
        const nilaiAkhir = Math.round((avgTP * 0.4) + (siswa.sumatifMateri * 0.3) + (siswa.pas * 0.3));
        const isTuntas = nilaiAkhir >= 75;

        // Menentukan TP Tertinggi & Terendah untuk Deskripsi Capaian
        const currentKelasTPs = databaseTP.filter(t => t.kelas === kelas);
        
        let maxVal = -1;
        let minVal = 101;
        let bestTPIndex = 1;
        let lowestTPIndex = 1;

        Object.entries(siswa.nilaiTP || {}).forEach(([key, val]) => {
          if (val > maxVal) { maxVal = val; bestTPIndex = key; }
          if (val < minVal) { minVal = val; lowestTPIndex = key; }
        });

        const bestTPObj = currentKelasTPs[bestTPIndex - 1];
        const lowestTPObj = currentKelasTPs[lowestTPIndex - 1];

        let deskripsi = '';
        if (bestTPObj && maxVal >= 75) {
          deskripsi += `Menunjukkan penguasaan yang sangat baik dalam ${bestTPObj.deskripsi.toLowerCase()} `;
        }
        if (lowestTPObj && minVal < 75) {
          deskripsi += `Perlu bimbingan dan peningkatan dalam ${lowestTPObj.deskripsi.toLowerCase()}`;
        } else if (bestTPObj && minVal >= 75) {
          deskripsi += `serta telah mencapai seluruh kriteria ketuntasan TP IPA dengan baik.`;
        }

        return { avgTP: Math.round(avgTP), nilaiAkhir, isTuntas, deskripsi };
      };

      // Export CSV
      const handleExportCSV = (kelas) => {
        const dataKelas = siswaData[kelas];
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += "NISN,Nama,L/P,Hadir,Sakit,Izin,Alpa,TP1,TP2,TP3,TP4,Rata TP,Sumatif Materi,PAS,Nilai Akhir,Status,Deskripsi Capaian\n";

        dataKelas.forEach(s => {
          const stats = calculateSiswaStats(s, kelas);
          const row = [
            `"${s.nisn}"`,
            `"${s.nama}"`,
            s.gender,
            s.presensi.H, s.presensi.S, s.presensi.I, s.presensi.A,
            s.nilaiTP[1] || 0, s.nilaiTP[2] || 0, s.nilaiTP[3] || 0, s.nilaiTP[4] || 0,
            stats.avgTP,
            s.sumatifMateri,
            s.pas,
            stats.nilaiAkhir,
            stats.isTuntas ? 'TUNTAS' : 'PERLU BIMBINGAN',
            `"${(stats.deskripsi || '').replace(/"/g, '""')}"`
          ];
          csvContent += row.join(",") + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Daftar_Nilai_IPA_Kelas_${kelas}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans">
          {/* HEADER / NAVIGATION BAR */}
          <header className="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-lg">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center py-4 gap-4">
              <div className="flex items-center space-x-3">
                <div className="p-2.5 bg-teal-500/20 text-teal-400 rounded-xl border border-teal-500/30">
                  <Icon name="GraduationCap" className="w-7 h-7" />
                </div>
                <div>
                  <h1 className="text-xl font-bold bg-gradient-to-r from-teal-400 to-cyan-300 bg-clip-text text-transparent">
                    Sistem Nilai & Presensi IPA
                  </h1>
                  <p className="text-xs text-slate-400">SMP Kelas 7, 8, dan 9 • Kurikulum Merdeka</p>
                </div>
              </div>

              {/* TAB NAVIGASI */}
              <nav className="flex space-x-1 bg-slate-900/80 p-1.5 rounded-xl border border-slate-700/60 overflow-x-auto max-w-full">
                <button
                  onClick={() => setActiveTab('tp-db')}
                  className={`flex items-center space-x-2 px-4 py-2 text-sm font-medium rounded-lg transition-all ${
                    activeTab === 'tp-db'
                      ? 'bg-teal-600 text-white shadow-md shadow-teal-900/30'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'
                  }`}
                >
                  <Icon name="BookMarked" className="w-4 h-4" />
                  <span>Database TP IPA</span>
                </button>
                {['7', '8', '9'].map(k => (
                  <button
                    key={k}
                    onClick={() => setActiveTab(`kelas-${k}`)}
                    className={`flex items-center space-x-2 px-4 py-2 text-sm font-medium rounded-lg transition-all ${
                      activeTab === `kelas-${k}`
                        ? 'bg-teal-600 text-white shadow-md shadow-teal-900/30'
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'
                    }`}
                  >
                    <Icon name="Users" className="w-4 h-4" />
                    <span>Kelas {k} IPA</span>
                  </button>
                ))}
              </nav>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {/* TAB DATABASE TP IPA */}
            {activeTab === 'tp-db' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-800/80 p-6 rounded-2xl border border-slate-700">
                  <div>
                    <h2 className="text-lg font-semibold text-white flex items-center gap-2">
                      <Icon name="BookOpen" className="w-5 h-5 text-teal-400" />
                      Database Tujuan Pembelajaran (TP) IPA
                    </h2>
                    <p className="text-sm text-slate-400">Kelola pemetaan elemen dan deskripsi TP untuk kelas 7, 8, dan 9 SMP.</p>
                  </div>
                  <button
                    onClick={() => {
                      setEditingTP(null);
                      setTpForm({ kelas: '7', kode: '', elemen: 'Pemahaman IPA', deskripsi: '' });
                      setIsTPModalOpen(true);
                    }}
                    className="flex items-center justify-center space-x-2 px-4 py-2.5 bg-teal-600 hover:bg-teal-500 text-white rounded-xl text-sm font-medium transition shadow-lg shadow-teal-900/20"
                  >
                    <Icon name="Plus" className="w-4 h-4" />
                    <span>Tambah TP Baru</span>
                  </button>
                </div>

                {/* SEARCH */}
                <div className="flex flex-col sm:flex-row gap-4 items-center justify-between">
                  <div className="relative w-full sm:w-72">
                    <div className="absolute left-3 top-3 text-slate-400">
                      <Icon name="Search" className="w-4 h-4" />
                    </div>
                    <input
                      type="text"
                      placeholder="Cari TP atau Deskripsi..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl pl-9 pr-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-teal-500"
                    />
                  </div>
                </div>

                {/* TABEL LIST TP */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {['7', '8', '9'].map(k => {
                    const listTP = databaseTP
                      .filter(t => t.kelas === k)
                      .filter(t => t.kode.toLowerCase().includes(searchTerm.toLowerCase()) || t.deskripsi.toLowerCase().includes(searchTerm.toLowerCase()));

                    return (
                      <div key={k} className="bg-slate-800/60 rounded-2xl border border-slate-700 overflow-hidden flex flex-col">
                        <div className="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center">
                          <span className="font-semibold text-teal-400 flex items-center gap-2">
                            <Icon name="Award" className="w-4 h-4" /> Kelas {k} IPA
                          </span>
                          <span className="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full font-medium">
                            {listTP.length} TP Terdaftar
                          </span>
                        </div>

                        <div className="p-4 space-y-3 flex-1 overflow-y-auto max-h-[600px]">
                          {listTP.length === 0 ? (
                            <p className="text-xs text-slate-500 italic text-center py-6">Tidak ada TP ditemukan</p>
                          ) : (
                            listTP.map(tp => (
                              <div key={tp.id} className="bg-slate-900/70 p-4 rounded-xl border border-slate-700/80 hover:border-slate-600 transition group">
                                <div className="flex justify-between items-start mb-2">
                                  <div>
                                    <span className="text-xs font-bold bg-teal-500/10 text-teal-400 px-2 py-0.5 rounded border border-teal-500/20">
                                      {tp.kode}
                                    </span>
                                    <span className="ml-2 text-[11px] text-slate-400">({tp.elemen})</span>
                                  </div>
                                  <div className="flex space-x-1 opacity-0 group-hover:opacity-100 transition">
                                    <button
                                      onClick={() => {
                                        setEditingTP(tp);
                                        setTpForm(tp);
                                        setIsTPModalOpen(true);
                                      }}
                                      className="p-1 hover:bg-slate-700 text-slate-400 hover:text-amber-400 rounded"
                                      title="Edit TP"
                                    >
                                      <Icon name="Edit3" className="w-3.5 h-3.5" />
                                    </button>
                                    <button
                                      onClick={() => handleDeleteTP(tp.id)}
                                      className="p-1 hover:bg-slate-700 text-slate-400 hover:text-rose-400 rounded"
                                      title="Hapus TP"
                                    >
                                      <Icon name="Trash2" className="w-3.5 h-3.5" />
                                    </button>
                                  </div>
                                </div>
                                <p className="text-xs text-slate-300 leading-relaxed">{tp.deskripsi}</p>
                              </div>
                            ))
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB MANAGEMENT KELAS 7, 8, DAN 9 */}
            {activeTab.startsWith('kelas-') && (() => {
              const kelas = activeTab.split('-')[1];
              const dataKelas = siswaData[kelas] || [];

              // Filtering
              const filteredSiswa = dataKelas.filter(s => 
                s.nama.toLowerCase().includes(searchTerm.toLowerCase()) || 
                s.nisn.includes(searchTerm)
              );

              // Statistical Calculations
              const statsList = filteredSiswa.map(s => calculateSiswaStats(s, kelas));
              const avgKelas = statsList.length ? Math.round(statsList.reduce((a, b) => a + b.nilaiAkhir, 0) / statsList.length) : 0;
              const maxNilai = statsList.length ? Math.max(...statsList.map(s => s.nilaiAkhir)) : 0;
              const minNilai = statsList.length ? Math.min(...statsList.map(s => s.nilaiAkhir)) : 0;
              const tuntasCount = statsList.filter(s => s.isTuntas).length;

              return (
                <div className="space-y-6">
                  {/* SUMMARY KELAS */}
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4 no-print">
                    <div className="bg-slate-800/80 p-5 rounded-2xl border border-slate-700 flex items-center justify-between">
                      <div>
                        <p className="text-xs font-medium text-slate-400">Total Siswa Kelas {kelas}</p>
                        <p className="text-2xl font-bold text-white mt-1">{dataKelas.length} <span className="text-xs font-normal text-slate-400">Siswa</span></p>
                      </div>
                      <div className="p-3 bg-blue-500/10 text-blue-400 rounded-xl">
                        <Icon name="Users" className="w-6 h-6" />
                      </div>
                    </div>

                    <div className="bg-slate-800/80 p-5 rounded-2xl border border-slate-700 flex items-center justify-between">
                      <div>
                        <p className="text-xs font-medium text-slate-400">Rata-rata Nilai Kelas</p>
                        <p className="text-2xl font-bold text-teal-400 mt-1">{avgKelas}</p>
                      </div>
                      <div className="p-3 bg-teal-500/10 text-teal-400 rounded-xl">
                        <Icon name="TrendingUp" className="w-6 h-6" />
                      </div>
                    </div>

                    <div className="bg-slate-800/80 p-5 rounded-2xl border border-slate-700 flex items-center justify-between">
                      <div>
                        <p className="text-xs font-medium text-slate-400">Tertinggi / Terendah</p>
                        <p className="text-2xl font-bold text-emerald-400 mt-1">{maxNilai} <span className="text-slate-500 text-sm font-normal">/ {minNilai}</span></p>
                      </div>
                      <div className="p-3 bg-emerald-500/10 text-emerald-400 rounded-xl">
                        <Icon name="Award" className="w-6 h-6" />
                      </div>
                    </div>

                    <div className="bg-slate-800/80 p-5 rounded-2xl border border-slate-700 flex items-center justify-between">
                      <div>
                        <p className="text-xs font-medium text-slate-400">Tingkat Ketuntasan</p>
                        <p className="text-2xl font-bold text-cyan-400 mt-1">
                          {dataKelas.length ? Math.round((tuntasCount / dataKelas.length) * 100) : 0}% 
                          <span className="text-xs font-normal text-slate-400 ml-1">({tuntasCount}/{dataKelas.length})</span>
                        </p>
                      </div>
                      <div className="p-3 bg-cyan-500/10 text-cyan-400 rounded-xl">
                        <Icon name="CheckCircle" className="w-6 h-6" />
                      </div>
                    </div>
                  </div>

                  {/* ACTION TOOLBAR */}
                  <div className="flex flex-col sm:flex-row justify-between items-center gap-4 bg-slate-800 p-4 rounded-2xl border border-slate-700 no-print">
                    <div className="relative w-full sm:w-80">
                      <div className="absolute left-3 top-3 text-slate-400">
                        <Icon name="Search" className="w-4 h-4" />
                      </div>
                      <input
                        type="text"
                        placeholder="Cari Siswa (Nama / NISN)..."
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl pl-9 pr-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-teal-500"
                      />
                    </div>

                    <div className="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                      <button
                        onClick={() => {
                          setEditingSiswa(null);
                          setSiswaForm({ nisn: '', nama: '', gender: 'L' });
                          setIsSiswaModalOpen(true);
                        }}
                        className="flex items-center space-x-2 px-3 py-2 bg-teal-600 hover:bg-teal-500 text-white rounded-xl text-xs font-medium transition"
                      >
                        <Icon name="Plus" className="w-4 h-4" />
                        <span>Tambah Siswa</span>
                      </button>
                      <button
                        onClick={() => handleExportCSV(kelas)}
                        className="flex items-center space-x-2 px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl text-xs font-medium transition"
                      >
                        <Icon name="Download" className="w-4 h-4" />
                        <span>Export CSV</span>
                      </button>
                      <button
                        onClick={() => window.print()}
                        className="flex items-center space-x-2 px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl text-xs font-medium transition"
                      >
                        <Icon name="Printer" className="w-4 h-4" />
                        <span>Cetak</span>
                      </button>
                    </div>
                  </div>

                  {/* DATA TABLE INTERAKTIF */}
                  <div className="bg-slate-800/90 rounded-2xl border border-slate-700 overflow-hidden shadow-xl">
                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse min-w-[1200px]">
                        <thead>
                          <tr className="bg-slate-900/80 text-[11px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-700">
                            <th className="py-3.5 px-4 w-12 text-center">No</th>
                            <th className="py-3.5 px-4">Identitas Siswa</th>
                            <th className="py-3.5 px-4 text-center bg-slate-800/40">Kehadiran (H/S/I/A)</th>
                            <th className="py-3.5 px-4 text-center">Formatif (TP 1-4)</th>
                            <th className="py-3.5 px-4 text-center bg-slate-800/40">Rata TP</th>
                            <th className="py-3.5 px-4 text-center">Sumatif Materi</th>
                            <th className="py-3.5 px-4 text-center">PAS/PAT</th>
                            <th className="py-3.5 px-4 text-center bg-slate-800/60 text-teal-400">Nilai Akhir</th>
                            <th className="py-3.5 px-4 text-center">Status</th>
                            <th className="py-3.5 px-4 w-80">Deskripsi Capaian TP</th>
                            <th className="py-3.5 px-4 text-center no-print">Aksi</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-700/60 text-xs">
                          {filteredSiswa.length === 0 ? (
                            <tr>
                              <td colSpan="11" className="text-center py-8 text-slate-500 italic">
                                Belum ada data siswa untuk kelas ini. Klik "Tambah Siswa" untuk memulai.
                              </td>
                            </tr>
                          ) : (
                            filteredSiswa.map((siswa, idx) => {
                              const stats = calculateSiswaStats(siswa, kelas);
                              return (
                                <tr key={siswa.id} className="hover:bg-slate-700/30 transition">
                                  {/* NO */}
                                  <td className="py-3 px-4 text-center font-medium text-slate-400">{idx + 1}</td>
                                  
                                  {/* IDENTITAS */}
                                  <td className="py-3 px-4">
                                    <div className="font-semibold text-slate-100">{siswa.nama}</div>
                                    <div className="text-[10px] text-slate-400 flex items-center gap-2">
                                      <span>NISN: {siswa.nisn}</span> • 
                                      <span className={siswa.gender === 'L' ? 'text-blue-400 font-medium' : 'text-pink-400 font-medium'}>
                                        {siswa.gender === 'L' ? 'Laki-laki' : 'Perempuan'}
                                      </span>
                                    </div>
                                  </td>

                                  {/* PRESENSI (H/S/I/A) */}
                                  <td className="py-3 px-3 bg-slate-800/30">
                                    <div className="flex items-center justify-center space-x-1">
                                      {['H', 'S', 'I', 'A'].map(code => (
                                        <div key={code} className="flex flex-col items-center">
                                          <span className="text-[9px] text-slate-500 font-semibold">{code}</span>
                                          <input
                                            type="number"
                                            min="0"
                                            value={siswa.presensi[code] || 0}
                                            onChange={(e) => handleUpdateNilaiOrPresensi(kelas, siswa.id, 'presensi', code, e.target.value)}
                                            className="w-8 text-center bg-slate-900 border border-slate-700 rounded p-1 text-xs text-slate-200 focus:border-teal-500 focus:outline-none"
                                          />
                                        </div>
                                      ))}
                                    </div>
                                  </td>

                                  {/* INPUT NILAI TP 1-4 */}
                                  <td className="py-3 px-3">
                                    <div className="flex items-center justify-center space-x-1">
                                      {[1, 2, 3, 4].map(tpNum => (
                                        <div key={tpNum} className="flex flex-col items-center">
                                          <span className="text-[9px] text-slate-500 font-semibold">TP{tpNum}</span>
                                          <input
                                            type="number"
                                            min="0"
                                            max="100"
                                            value={siswa.nilaiTP[tpNum] || 0}
                                            onChange={(e) => handleUpdateNilaiOrPresensi(kelas, siswa.id, 'nilaiTP', tpNum, e.target.value)}
                                            className="w-10 text-center bg-slate-900 border border-slate-700 rounded p-1 text-xs text-slate-100 font-medium focus:border-teal-500 focus:outline-none"
                                          />
                                        </div>
                                      ))}
                                    </div>
                                  </td>

                                  {/* RATA TP */}
                                  <td className="py-3 px-4 text-center font-semibold bg-slate-800/40 text-slate-300">
                                    {stats.avgTP}
                                  </td>

                                  {/* SUMATIF MATERI */}
                                  <td className="py-3 px-4 text-center">
                                    <input
                                      type="number"
                                      min="0"
                                      max="100"
                                      value={siswa.sumatifMateri}
                                      onChange={(e) => handleUpdateNilaiOrPresensi(kelas, siswa.id, 'sumatif', 'sumatifMateri', e.target.value)}
                                      className="w-12 text-center bg-slate-900 border border-slate-700 rounded p-1 text-xs text-slate-100 font-medium focus:border-teal-500 focus:outline-none"
                                    />
                                  </td>

                                  {/* PAS/PAT */}
                                  <td className="py-3 px-4 text-center">
                                    <input
                                      type="number"
                                      min="0"
                                      max="100"
                                      value={siswa.pas}
                                      onChange={(e) => handleUpdateNilaiOrPresensi(kelas, siswa.id, 'pas', 'pas', e.target.value)}
                                      className="w-12 text-center bg-slate-900 border border-slate-700 rounded p-1 text-xs text-slate-100 font-medium focus:border-teal-500 focus:outline-none"
                                    />
                                  </td>

                                  {/* NILAI AKHIR */}
                                  <td className="py-3 px-4 text-center font-bold text-sm bg-slate-800/60 text-teal-300">
                                    {stats.nilaiAkhir}
                                  </td>

                                  {/* STATUS KETUNTASAN */}
                                  <td className="py-3 px-4 text-center">
                                    {stats.isTuntas ? (
                                      <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                        TUNTAS
                                      </span>
                                    ) : (
                                      <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-500/10 text-rose-400 border border-rose-500/20">
                                        PERLU BIMBINGAN
                                      </span>
                                    )}
                                  </td>

                                  {/* DESKRIPSI CAPAIAN */}
                                  <td className="py-3 px-4">
                                    <p className="text-[11px] text-slate-300 leading-snug line-clamp-3 hover:line-clamp-none transition">
                                      {stats.deskripsi}
                                    </p>
                                  </td>

                                  {/* AKSI */}
                                  <td className="py-3 px-4 text-center no-print">
                                    <div className="flex items-center justify-center space-x-1">
                                      <button
                                        onClick={() => {
                                          setEditingSiswa(siswa);
                                          setSiswaForm({ nisn: siswa.nisn, nama: siswa.nama, gender: siswa.gender });
                                          setIsSiswaModalOpen(true);
                                        }}
                                        className="p-1 hover:bg-slate-700 text-slate-400 hover:text-amber-400 rounded"
                                        title="Edit Siswa"
                                      >
                                        <Icon name="Edit3" className="w-3.5 h-3.5" />
                                      </button>
                                      <button
                                        onClick={() => handleDeleteSiswa(kelas, siswa.id)}
                                        className="p-1 hover:bg-slate-700 text-slate-400 hover:text-rose-400 rounded"
                                        title="Hapus Siswa"
                                      >
                                        <Icon name="Trash2" className="w-3.5 h-3.5" />
                                      </button>
                                    </div>
                                  </td>
                                </tr>
                              );
                            })
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              );
            })()}
          </main>

          {/* MODAL EDIT / TAMBAH SISWA */}
          {isSiswaModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                  <h3 className="text-lg font-semibold text-white">
                    {editingSiswa ? 'Edit Data Siswa' : 'Tambah Siswa Baru'}
                  </h3>
                  <button onClick={() => setIsSiswaModalOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-medium text-slate-300 block mb-1">NISN</label>
                    <input
                      type="text"
                      value={siswaForm.nisn}
                      onChange={(e) => setSiswaForm({ ...siswaForm, nisn: e.target.value })}
                      placeholder="Contoh: 008291012"
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-teal-500"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-medium text-slate-300 block mb-1">Nama Lengkap Siswa</label>
                    <input
                      type="text"
                      value={siswaForm.nama}
                      onChange={(e) => setSiswaForm({ ...siswaForm, nama: e.target.value })}
                      placeholder="Contoh: Ahmad Subagja"
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-teal-500"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-medium text-slate-300 block mb-1">Jenis Kelamin</label>
                    <select
                      value={siswaForm.gender}
                      onChange={(e) => setSiswaForm({ ...siswaForm, gender: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-teal-500"
                    >
                      <option value="L">Laki-laki (L)</option>
                      <option value="P">Perempuan (P)</option>
                    </select>
                  </div>
                </div>

                <div className="flex justify-end space-x-2 pt-3 border-t border-slate-700">
                  <button
                    onClick={() => setIsSiswaModalOpen(false)}
                    className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl text-xs font-medium"
                  >
                    Batal
                  </button>
                  <button
                    onClick={() => handleAddOrUpdateSiswa(activeTab.split('-')[1])}
                    className="px-4 py-2 bg-teal-600 hover:bg-teal-500 text-white rounded-xl text-xs font-medium flex items-center space-x-1"
                  >
                    <Icon name="Save" className="w-4 h-4" />
                    <span>Simpan</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL EDIT / TAMBAH DATABASE TP */}
          {isTPModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                  <h3 className="text-lg font-semibold text-white">
                    {editingTP ? 'Edit Tujuan Pembelajaran' : 'Tambah TP IPA Baru'}
                  </h3>
                  <button onClick={() => setIsTPModalOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-medium text-slate-300 block mb-1">Tingkat Kelas</label>
                    <select
                      value={tpForm.kelas}
                      onChange={(e) => setTpForm({ ...tpForm, kelas: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-teal-500"
                    >
                      <option value="7">Kelas 7</option>
                      <option value="8">Kelas 8</option>
                      <option value="9">Kelas 9</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-xs font-medium text-slate-300 block mb-1">Kode TP</label>
                    <input
                      type="text"
                      value={tpForm.kode}
                      onChange={(e) => setTpForm({ ...tpForm, kode: e.target.value })}
                      placeholder="Contoh: TP 7.1"
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-teal-500"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-medium text-slate-300 block mb-1">Elemen IPA</label>
                    <select
                      value={tpForm.elemen}
                      onChange={(e) => setTpForm({ ...tpForm, elemen: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-teal-500"
                    >
                      <option value="Pemahaman IPA">Pemahaman IPA</option>
                      <option value="Keterampilan Proses">Keterampilan Proses</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-xs font-medium text-slate-300 block mb-1">Deskripsi Lengkap TP</label>
                    <textarea
                      rows="3"
                      value={tpForm.deskripsi}
                      onChange={(e) => setTpForm({ ...tpForm, deskripsi: e.target.value })}
                      placeholder="Tuliskan capaian yang diharapkan..."
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-teal-500"
                    />
                  </div>
                </div>

                <div className="flex justify-end space-x-2 pt-3 border-t border-slate-700">
                  <button
                    onClick={() => setIsTPModalOpen(false)}
                    className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl text-xs font-medium"
                  >
                    Batal
                  </button>
                  <button
                    onClick={handleAddOrUpdateTP}
                    className="px-4 py-2 bg-teal-600 hover:bg-teal-500 text-white rounded-xl text-xs font-medium flex items-center space-x-1"
                  >
                    <Icon name="Save" className="w-4 h-4" />
                    <span>Simpan</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500 no-print">
            Sistem Penilaian Terintegrasi IPA SMP • Kurikulum Merdeka
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
